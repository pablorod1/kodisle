name: Kodisle
options:
  bundleIdPrefix: io.github.pablorod1
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Kodisle:
    type: application
    platform: macOS
    sources: [Kodisle]
    info:
      path: Kodisle/Info.plist
      properties:
        CFBundleDisplayName: Kodisle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "MIT License"
        NSDownloadsFolderUsageDescription: "Kodisle lists your recent downloads in the Downloads widget."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pablorod1.kodisle
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
