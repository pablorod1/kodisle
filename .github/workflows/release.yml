name: Release

# Push a tag like v0.2.0 to publish a new version:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build universal app
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME#v}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Kodisle.zip build/Kodisle.zip.sha256 \
            --title "Kodisle $GITHUB_REF_NAME" --generate-notes
      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN not set — update pablorod1/homebrew-tap manually (see CONTRIBUTING.md)."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(cut -d' ' -f1 build/Kodisle.zip.sha256)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/pablorod1/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/kodisle.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "kodisle $VERSION"
          git push
