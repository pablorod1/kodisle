name: Verify tap token (temporary)

on: workflow_dispatch

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check write access to homebrew-tap (dry run, nothing is pushed)
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          [ -n "$TAP_TOKEN" ] || { echo "TAP_TOKEN is empty"; exit 1; }
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/pablorod1/homebrew-tap.git" tap
          cd tap
          git config user.name "dry-run"; git config user.email "dry-run@example.com"
          git commit -q --allow-empty -m "dry run"
          git push --dry-run origin HEAD:main
          echo "✓ TAP_TOKEN can push to pablorod1/homebrew-tap"
